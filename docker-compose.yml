services:
  daigestr:
    build:
      context: ./mcp
      args:
        DAIGESTR_VERSION: ${DAIGESTR_VERSION:-dev}
    container_name: daigestr
    restart: unless-stopped
    env_file: .env
    ports:
      - "18005:8080"
      - "18006:8081"
    environment:
      - DAIGESTR_VERSION=5.6.0
    volumes:
      - ./data:/data
      - /root/docker/dev-durst-bewerbung/dev-data:/testdata:ro
    networks:
      - shared-network
      - default

networks:
  shared-network:
    external: true
